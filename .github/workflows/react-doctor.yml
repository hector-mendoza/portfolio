name: React Doctor

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@main
        with:
          diff: master
          github-token: ${{ secrets.GITHUB_TOKEN }}
